[project]
name = "zerodha-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "prathamtaheem@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "kiteconnect>=5.2.2",
    "mcp>=2.3.0",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
zerodha-mcp = "zerodha_mcp:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
